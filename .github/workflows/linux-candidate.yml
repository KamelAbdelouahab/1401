name: Linux candidate build and verification

on:
  workflow_dispatch:
  push:
    branches:
      - claude/funny-davinci-5spj6n
      - support/linux-candidate
    paths:
      - 'p1401/**'
      - 'linux/**'
      - 'tools/linux_release.py'
      - 'tests/**'
      - '.github/workflows/linux-candidate.yml'

permissions:
  contents: read

jobs:
  distro:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13 (trixie)
            image: debian:trixie
            setup: |
              apt-get update
              apt-get install -y --no-install-recommends python3 git binutils zstd xvfb xauth dosfstools mtools util-linux \
                ca-certificates gcc libc6-dev pciutils usbutils fonts-dejavu-core libgl1 libegl1 libfontconfig1 libfreetype6 \
                libxkbcommon0 libdbus-1-3 libglib2.0-0 libx11-6 libx11-xcb1 libxcb1 libxcb-render0 libxcb-shape0 libxcb-shm0 \
                libxcb-sync1 libxcb-xfixes0 libxcb-randr0 libxcb-glx0 libwayland-client0 libwayland-cursor0 libwayland-egl1
          - name: CachyOS
            image: cachyos/cachyos:latest
            setup: |
              pacman-key --init && pacman-key --populate || true
              pacman -Syu --noconfirm --needed python git binutils zstd xorg-server-xvfb xorg-xauth dosfstools mtools \
                util-linux gcc pciutils usbutils which ttf-dejavu mesa libglvnd fontconfig freetype2 libxkbcommon dbus glib2 \
                libx11 libxcb wayland
    container:
      image: ${{ matrix.image }}
      options: --privileged -v /dev:/dev
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install the build and desktop libraries this distribution ships
        run: ${{ matrix.setup }}
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the package from pinned inputs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -B tools/linux_release.py prepare --stage /tmp/stage --cache /tmp/cache
      - name: Engine and writer tests with the packaged Python (loop-device erase included)
        run: P1401_LOOP_TESTS=1 /tmp/stage/1401/engine/python/bin/python3 -B -m unittest discover -s tests -t . -p 'test_*.py'
      - name: Fetch the public hardware corpus
        run: python3 -B tests/corpus/fetch.py
      - name: Packaged window and engine checks
        run: xvfb-run -a python3 -B tools/linux_release.py check --stage /tmp/stage --output /tmp/linux-verification.json
      - name: Full EFI builds over the corpus (downloads, iasl, ocvalidate) with the packaged Python
        run: |
          /tmp/stage/1401/engine/python/bin/python3 -B tests/run_corpus.py build | tee /tmp/corpus.txt
          ok=$(grep -cE '^[a-z0-9-]+ +OK ' /tmp/corpus.txt || true)
          echo "machines built and validated: $ok"
          test "$ok" -ge 10

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y xvfb dosfstools zstd binutils libgl1 libegl1 libopengl0 libfontconfig1 libxkbcommon0 libdbus-1-3
      - name: Prepare, verify and package
        run: |
          python3 -B tools/linux_release.py prepare --stage "$RUNNER_TEMP/stage" --cache "$RUNNER_TEMP/cache"
          xvfb-run -a python3 -B tools/linux_release.py check --stage "$RUNNER_TEMP/stage" --output "$RUNNER_TEMP/linux-verification.json"
          python3 -B tools/linux_release.py package --stage "$RUNNER_TEMP/stage" --evidence "$RUNNER_TEMP/linux-verification.json" --output "$RUNNER_TEMP/dist"
      - name: Retain the verified candidate for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-candidate
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
