name: Linux window diagnostics (CachyOS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cachyos:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: cachyos/cachyos:latest
    steps:
      - name: Packages
        run: |
          pacman-key --init && pacman-key --populate || true
          pacman -Syu --noconfirm --needed python git binutils zstd xorg-server-xvfb xorg-xauth gdb which ttf-dejavu \
            mesa libglvnd fontconfig freetype2 libxkbcommon dbus glib2 libx11 libxcb wayland
          pacman -Q mesa libxcb libxkbcommon libx11 fontconfig freetype2 glibc xorg-server-xvfb || true
          grep -m1 -o 'avx512[a-z]*\|avx2' /proc/cpuinfo | sort -u || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -B tools/linux_release.py prepare --stage /tmp/stage --cache /tmp/cache
      - name: Variants
        run: |
          R=/tmp/stage/1401
          try() { echo "=== $1"; shift; env XDG_DATA_HOME=/tmp/x "$@" xvfb-run -a "$R/1401" --verify-package /tmp/v.json >/tmp/out.txt 2>&1; echo "exit $?"; tail -5 /tmp/out.txt; }
          try "default"
          try "no GL integration" QT_XCB_GL_INTEGRATION=none
          try "offscreen" QT_QPA_PLATFORM=offscreen
          try "no X11 fallback libraries" XDG_CACHE_HOME=/nonexistent-cache
          try "software OpenGL" QT_OPENGL=software LIBGL_ALWAYS_SOFTWARE=1
      - name: Backtrace
        run: |
          R=/tmp/stage/1401
          export A1401_HOME=$R PYTHONPATH=$R/app XDG_DATA_HOME=/tmp/x QT_QPA_PLATFORM=xcb LD_LIBRARY_PATH=$HOME/.cache/1401/x11-fallback
          xvfb-run -a gdb -batch -ex run -ex bt -ex "info sharedlibrary" --args $R/engine/python/bin/python3 -m a1401 --verify-package /tmp/v.json 2>&1 | grep -v "^\[New Thread\|^\[Thread" | tail -150
